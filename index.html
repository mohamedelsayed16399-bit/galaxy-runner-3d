 const danger=[...ebs.filter(e=>e.z>-22&&e.z<2),...objs.filter(o=>(o.t=="rock"||o.t=="drone"||o.t=="kami")&&o.z>-24&&o.z<2)];let best=tgt,bs=1e9;for(let x=-XMAX;x<=XMAX;x+=.5){let pen=Math.abs(x-tgt)*.6;for(const d of danger){const dx=Math.abs((d.m?d.m.position.x:d.x)-x);const lim=d.t=="rock"||d.t=="drone"||d.t=="kami"?2.8:1.8;if(dx<lim)pen+=(lim-dx)*(30-Math.abs(d.z))*1.5}if(beam&&Math.abs(beam.x-x)<2.4)pen+=200;pen+=Math.abs(x-tgx)*.15;if(pen<bs){bs=pen;best=x}}tgx=best}
setInterval(()=>{if(window.__bot&&st=="play")botStep()},50);
modelsReady.then(()=>{$("load").style.display="none";toTitle()});
requestAnimationFrame(frame);
</script>
